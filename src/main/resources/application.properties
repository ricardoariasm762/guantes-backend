spring.application.name=guantes-backend

# Puerto dinámico asignado por Render (o 8080 por defecto en local)
server.port=${PORT:8080}
# Escuchar en todas las interfaces de red para permitir tráfico externo en Render
server.address=0.0.0.0

# Base de datos PostgreSQL vía variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guantes_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Autenticación JWT (obligatorio definir JWT_SECRET >= 32 bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS permitido (URL de Vercel en CORS_ALLOWED_ORIGINS en producción; localhost:5173 en local)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Spring Boot Actuator: exponer solo health sin detalles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Zona horaria oficial (Colombia UTC-5)
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}
spring.jackson.time-zone=America/Bogota