spring.application.name=guantes-backend

# Puerto dinámico asignado por Render (o 8080 por defecto en local)
server.port=${PORT:8080}
# Escuchar en todas las interfaces de red para permitir tráfico externo en Render
server.address=0.0.0.0

# Base de datos PostgreSQL vía variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guantes_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Autenticación JWT
jwt.secret=${JWT_SECRET:tu_clave_secreta_muy_larga_y_segura_para_desarrollo_local_123456}
jwt.expiration=86400000

# CORS permitido (URL de Vercel en Render o comodín/localhost por defecto)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,*}