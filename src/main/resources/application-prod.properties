# =====================================================================
# Configuración para perfil de producción detrás de CloudFront (prod)
# =====================================================================

# Encabezados reenviados (X-Forwarded-*) para que Swagger y redirecciones
# utilicen el esquema HTTPS y el nombre de dominio público de CloudFront
server.forward-headers-strategy=framework

# JPA y Hibernate: Se mantiene 'update' debido a que el proyecto no cuenta con
# migraciones versionadas (Flyway/Liquibase) y la base de datos PostgreSQL en RDS
# se inicializa vacía al primer despliegue.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Pool de conexiones Hikari optimizado para instancia RDS db.t4g.micro
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Spring Boot Actuator: exponer únicamente el endpoint de salud sin detalles sensibles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Formato de logs de consola en una sola línea para agregación en contenedores Docker y CloudWatch
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Zona horaria oficial (Colombia UTC-5)
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}
spring.jackson.time-zone=America/Bogota

